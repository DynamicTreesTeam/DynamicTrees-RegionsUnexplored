import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.99'
    id 'idea'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

//tasks.named('wrapper', Wrapper).configure {
